# 매일 수집 → 빌드 → GitHub Pages(gh-pages 브랜치) 배포.
# 수집 시각: 매일 09:07 KST (= 00:07 UTC). Actions 예약 실행은 몇 분~수십 분 늦게 시작될 수 있다.
name: daily

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      collect:
        description: "수집까지 할지 (false면 빌드·배포만)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "build/**"
      - "config/**"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DO_COLLECT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Install Chromium
        if: env.DO_COLLECT == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Collect Beauty Top 100 (6 countries)
        if: env.DO_COLLECT == 'true'
        run: python -m scraper.collect_kbeauty --method playwright

      - name: Look up brands of new ASINs (once per ASIN)
        if: env.DO_COLLECT == 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: python -m scraper.brand_lookup --max 300

      - name: Build site data
        run: python -m build.build_site

      - name: Commit data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 원자료(data/)만 main에 올린다. docs/data는 빌드 결과라 gh-pages에만 배포한다.
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Seoul date +%F) 수집 [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::main에 원자료를 올리지 못했습니다"; exit 1

      - name: Deploy docs/ to gh-pages
        run: |
          cp -r docs "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy $(TZ=Asia/Seoul date '+%F %H:%M') KST"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - uses: actions/upload-artifact@v4
        if: always() && env.DO_COLLECT == 'true'
        with:
          name: collect-html
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
